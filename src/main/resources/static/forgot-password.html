<!doctype html>
<html lang="vi">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>HR Management | Quên mật khẩu</title>

    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css?family=Source+Sans+Pro:300,400,400i,700&display=fallback"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/admin-lte@3.2/dist/css/adminlte.min.css"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.css"
    />
  </head>
  <body class="hold-transition login-page">
    <div class="login-box">
      <div class="login-logo">
        <a href="#"><b>HR</b> Management</a>
      </div>
      <div class="card">
        <div class="card-body login-card-body">
          <p class="login-box-msg">
            Bạn quên mật khẩu? Nhập email của bạn dưới đây để nhận liên kết đặt
            lại mật khẩu.
          </p>

          <form id="forgotPasswordForm">
            <div class="input-group mb-3">
              <input
                type="email"
                class="form-control"
                id="email"
                placeholder="Nhập Email của bạn"
                required
              />
              <div class="input-group-append">
                <div class="input-group-text">
                  <span class="fas fa-envelope"></span>
                </div>
              </div>
            </div>
            <div class="row">
              <div class="col-12">
                <button
                  type="submit"
                  class="btn btn-primary btn-block"
                  id="btnSendMail"
                >
                  Yêu cầu mật khẩu mới
                </button>
              </div>
            </div>
          </form>

          <p class="mt-3 mb-1">
            <a href="login.html">Quay lại Đăng nhập</a>
          </p>
          <p class="mb-0">
            <a href="register.html" class="text-center"
              >Đăng ký thành viên mới</a
            >
          </p>
        </div>
      </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.6.0/jquery.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.1/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/admin-lte@3.2/dist/js/adminlte.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <script >
      document
        .getElementById("forgotPasswordForm")
        .addEventListener("submit", async function (e) {
          e.preventDefault();

          const email = document.getElementById("email").value;
          const btnSendMail = document.getElementById("btnSendMail");

          btnSendMail.disabled = true;
          btnSendMail.innerHTML =
            '<i class="fas fa-spinner fa-spin"></i> Đang gửi mail...';

          try {
            const response = await fetch(
              "http:///api/auth/forgot-password",
              {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ email }),
              },
            );

            const data = await response.text();

            if (response.ok) {
              Swal.fire({
                icon: "success",
                title: "Đã gửi Email!",
                text: data,
              });
              document.getElementById("email").value = ""; // Xóa trắng ô nhập sau khi gửi
            } else {
              Swal.fire("Lỗi", data, "error");
            }
          } catch (error) {
            Swal.fire(
              "Lỗi kết nối",
              "Không thể kết nối đến máy chủ Backend",
              "error",
            );
          } finally {
            btnSendMail.disabled = false;
            btnSendMail.innerHTML = "Yêu cầu mật khẩu mới";
          }
        });
    </script>
  </body>
</html>
