<!doctype html>
<html lang="vi">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>HR Management | Đăng ký</title>

    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css?family=Source+Sans+Pro:300,400,400i,700&display=fallback"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/admin-lte@3.2/dist/css/adminlte.min.css"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.css"
    />
  </head>
  <body class="hold-transition register-page">
    <div class="register-box">
      <div class="register-logo">
        <a href="#"><b>HR</b> Management</a>
      </div>

      <div class="card">
        <div class="card-body register-card-body">
          <p class="login-box-msg">Đăng ký tài khoản mới</p>

          <form id="registerForm">
            <div class="input-group mb-3">
              <input
                type="text"
                class="form-control"
                id="reg_username"
                placeholder="Tên đăng nhập"
                required
                minlength="4"
              />
              <div class="input-group-append">
                <div class="input-group-text">
                  <span class="fas fa-user"></span>
                </div>
              </div>
            </div>
            <div class="input-group mb-3">
              <input
                type="email"
                class="form-control"
                id="reg_email"
                placeholder="Email"
                required
              />
              <div class="input-group-append">
                <div class="input-group-text">
                  <span class="fas fa-envelope"></span>
                </div>
              </div>
            </div>
            <div class="input-group mb-3">
              <input
                type="password"
                class="form-control"
                id="reg_password"
                placeholder="Mật khẩu (ít nhất 6 ký tự)"
                required
                minlength="6"
              />
              <div class="input-group-append">
                <div class="input-group-text">
                  <span class="fas fa-lock"></span>
                </div>
              </div>
            </div>
            <div class="row">
              <div class="col-12">
                <button
                  type="submit"
                  class="btn btn-primary btn-block"
                  id="btnRegister"
                >
                  Đăng ký
                </button>
              </div>
            </div>
          </form>

          <div class="social-auth-links text-center">
            <p>- HOẶC -</p>
            <a href="login.html" class="text-center"
              >Tôi đã có tài khoản, quay lại Đăng nhập</a
            >
          </div>
        </div>
      </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.6.0/jquery.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.1/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/admin-lte@3.2/dist/js/adminlte.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <script>
      document
        .getElementById("registerForm")
        .addEventListener("submit", async function (e) {
          e.preventDefault();

          const username = document.getElementById("reg_username").value;
          const email = document.getElementById("reg_email").value;
          const password = document.getElementById("reg_password").value;
          const btnRegister = document.getElementById("btnRegister");

          btnRegister.disabled = true;
          btnRegister.innerHTML =
            '<i class="fas fa-spinner fa-spin"></i> Đang xử lý...';

          try {
            // SỬA QUAN TRỌNG: Bỏ localhost, dùng đường dẫn tương đối
            const response = await fetch("/api/auth/register", {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({ username, email, password }),
            });

            const data = await response.text();

            if (response.ok) {
              Swal.fire({
                icon: "success",
                title: "Thành công",
                text: data,
              }).then(() => {
                window.location.href = "login.html";
              });
            } else {
              Swal.fire("Lỗi đăng ký", data, "error");
            }
          } catch (error) {
            console.error("Lỗi kết nối:", error);
            Swal.fire(
              "Lỗi kết nối",
              "Không thể kết nối đến máy chủ Backend. Kiểm tra link server hoặc Database!",
              "error"
            );
          } finally {
            btnRegister.disabled = false;
            btnRegister.innerHTML = "Đăng ký";
          }
        });
    </script>
  </body>
</html>
