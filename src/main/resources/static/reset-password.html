<!doctype html>
<html lang="vi">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>HR Management | Đặt lại mật khẩu</title>

    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css?family=Source+Sans+Pro:300,400,400i,700&display=fallback"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/admin-lte@3.2/dist/css/adminlte.min.css"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.css"
    />
  </head>
  <body class="hold-transition login-page">
    <div class="login-box">
      <div class="login-logo">
        <a href="#"><b>HR</b> Management</a>
      </div>
      <div class="card">
        <div class="card-body login-card-body">
          <p class="login-box-msg">
            Bạn chỉ còn một bước nữa. Hãy thiết lập mật khẩu mới của bạn ngay
            bây giờ.
          </p>

          <div id="errorBox" class="alert alert-danger d-none text-center">
            Liên kết không hợp lệ hoặc đã hết hạn!
          </div>

          <form id="resetPasswordForm">
            <div class="input-group mb-3">
              <input
                type="password"
                class="form-control"
                id="newPassword"
                placeholder="Mật khẩu mới (ít nhất 6 ký tự)"
                required
                minlength="6"
              />
              <div class="input-group-append">
                <div class="input-group-text">
                  <span class="fas fa-lock"></span>
                </div>
              </div>
            </div>
            <div class="input-group mb-3">
              <input
                type="password"
                class="form-control"
                id="confirmPassword"
                placeholder="Xác nhận mật khẩu mới"
                required
                minlength="6"
              />
              <div class="input-group-append">
                <div class="input-group-text">
                  <span class="fas fa-lock"></span>
                </div>
              </div>
            </div>
            <div class="row">
              <div class="col-12">
                <button
                  type="submit"
                  class="btn btn-primary btn-block"
                  id="btnResetPass"
                >
                  Đổi mật khẩu
                </button>
              </div>
            </div>
          </form>

          <p class="mt-3 mb-1">
            <a href="login.html">Quay lại Đăng nhập</a>
          </p>
        </div>
      </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.6.0/jquery.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.1/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/admin-lte@3.2/dist/js/adminlte.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <script >
      // 1. Lấy Token từ URL
      const urlParams = new URLSearchParams(window.location.search);
      const token = urlParams.get("token");

      // 2. Nếu không có token, chặn form không cho người dùng bấm lung tung
      if (!token) {
        document.getElementById("resetPasswordForm").classList.add("d-none");
        document.getElementById("errorBox").classList.remove("d-none");
      }

      // 3. Xử lý đổi mật khẩu
      document
        .getElementById("resetPasswordForm")
        .addEventListener("submit", async function (e) {
          e.preventDefault();

          const newPassword = document.getElementById("newPassword").value;
          const confirmPassword =
            document.getElementById("confirmPassword").value;
          const btnResetPass = document.getElementById("btnResetPass");

          // Kiểm tra mật khẩu khớp nhau
          if (newPassword !== confirmPassword) {
            Swal.fire("Lỗi", "Mật khẩu xác nhận không khớp!", "warning");
            return;
          }

          btnResetPass.disabled = true;
          btnResetPass.innerHTML =
            '<i class="fas fa-spinner fa-spin"></i> Đang xử lý...';

          try {
            const response = await fetch(
              "/api/auth/reset-password",
              {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ token, newPassword }), // Gửi kèm token xuống DB
              },
            );

            const data = await response.text();

            if (response.ok) {
              Swal.fire({
                icon: "success",
                title: "Thành công!",
                text: data, // "Đặt lại mật khẩu thành công..."
              }).then(() => {
                window.location.href = "login.html"; // Đổi xong tự chuyển về trang Login
              });
            } else {
              Swal.fire("Lỗi", data, "error");
            }
          } catch (error) {
            Swal.fire(
              "Lỗi kết nối",
              "Không thể kết nối đến máy chủ Backend",
              "error",
            );
          } finally {
            btnResetPass.disabled = false;
            btnResetPass.innerHTML = "Đổi mật khẩu";
          }
        });
    </script>
  </body>
</html>
